name: Desktop checks and builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - if: matrix.target == 'macos'
        run: bash tool/build_macos.sh
      - if: matrix.target == 'windows'
        run: flutter build windows --release
      - if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/RN Network Viewer.app" build/rn-network-viewer-macos.zip
      - if: matrix.target == 'macos'
        run: shasum -a 256 build/rn-network-viewer-macos.zip > build/SHA256SUMS.txt
      - if: matrix.target == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/rn-network-viewer-windows.zip
          $hash = (Get-FileHash build/rn-network-viewer-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  rn-network-viewer-windows.zip" | Set-Content build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rn-network-viewer-${{ matrix.target }}
          path: |
            build/rn-network-viewer-macos.zip
            build/rn-network-viewer-windows.zip
            build/SHA256SUMS.txt
